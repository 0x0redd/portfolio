<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 460" width="530" height="460">
  <defs>
    <!-- Softer, deeper gradient -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5af6e9"/>
      <stop offset="50%" stop-color="#4b8aff"/>
      <stop offset="100%" stop-color="#2222da"/>
    </linearGradient>

    <!-- Smooth pulse animation in gradient stops -->
    <linearGradient id="animatedBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5af6e9">
        <animate attributeName="stop-opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#4b8aff">
        <animate attributeName="stop-opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite" begin="0.8s"/>
      </stop>
      <stop offset="100%" stop-color="#2222da">
        <animate attributeName="stop-opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite" begin="1.6s"/>
      </stop>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes drawPath {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -2050; }
      }
      @keyframes beamPulse {
        0%,100% { stroke-width: 3; opacity: 0.7; }
        50% { stroke-width: 5; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Base glow line -->
  <path 
    fill="none"
    stroke="url(#beamGradient)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
    filter="url(#softGlow)"
